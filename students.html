<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students - Placement Management</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="sidebar">

    <h2>🎓 Placement</h2>
    <h2>Management</h2>

    <a href="index.html">🏠 Dashboard</a>
    <a href="students.html" class="active">👨‍🎓 Students</a>
    <a href="companies.html">🏢 Companies</a>
    <a href="placements.html">💼 Placements</a>
    <a href="efficiency.html">📊 Efficiency</a>

</div>

<div class="main">

    <div class="topbar">

        <div>
            <h1>Students</h1>
            <p>Manage student records</p>
        </div>

    </div>

    <div class="form-panel">

        <h2>➕ Add Student</h2>

        <form id="studentForm">

            <input type="hidden" id="studentId">

            <input type="text" id="studentName"
                   placeholder="Student Name" required>

            <input type="email" id="studentEmail"
                   placeholder="Email" required>

            <input type="text" id="studentDept"
                   placeholder="Department" required>

            <input type="number" id="studentYear"
                   placeholder="Year" required>

            <input type="number" step="0.1"
                   id="studentCgpa"
                   placeholder="CGPA" required>

            <select id="studentStatus">

                <option value="Eligible">Eligible</option>
                <option value="Placed">Placed</option>
                <option value="Not Eligible">Not Eligible</option>

            </select>

            <button type="submit" class="btn">
                Save Student
            </button>

        </form>

    </div>

    <div class="panel">

        <div class="table-header">

            <h2>👨‍🎓 Student List</h2>

            <input type="text"
                   id="searchStudent"
                   placeholder="🔍 Search student">

        </div>

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Year</th>
                    <th>CGPA</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="studentTable"></tbody>

        </table>

    </div>

</div>

<script src="js/storage.js"></script>
<script src="js/students.js"></script>

</body>
</html>
